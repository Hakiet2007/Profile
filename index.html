<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | 16-Year-Old Coder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Thêm Font chữ từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Các lớp màu tạo hiệu ứng background blur giống ảnh -->
    <div class="bg-container">
        <div class="blob blob-blue"></div>
        <div class="blob blob-purple"></div>
        <div class="blob blob-cyan"></div>
    </div>

    <main class="profile-card">
        <div class="avatar-container">
            <div class="avatar">👨‍💻</div>
        </div>
        
        <h1 id="greeting">Chào bạn!</h1>
        <p class="bio">
            Mình là một lập trình viên <strong>16 tuổi</strong>. Đang học hỏi mỗi ngày để tạo ra những thứ thú vị trên Internet.
        </p>

        <div class="tech-stack">
            <span>HTML5</span>
            <span>CSS3</span>
            <span>JavaScript</span>
        </div>

        <div class="project-section">
            <p>Sản phẩm của mình:</p>
            <a href="https://eduweb-352692699741.asia-southeast1.run.app/" target="_blank" class="btn-link">
                🚀 Truy cập EduWeb
            </a>
        </div>

        <div class="social-links">
            <!-- Bạn có thể thêm link Facebook/Github của mình ở đây -->
            <span>Connect with me: </span>
            <a href="#">Github</a>
            <a href="#">Facebook</a>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
